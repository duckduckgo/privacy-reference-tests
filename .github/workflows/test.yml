name: Test Implementations
# If this job is failing, check if there were any updates to
# https://github.com/duckduckgo/apple-browsers/blob/main/.github/workflows/bsk_pr_checksyml

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  extension-mv2:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'reference-tests'
      - uses: actions/checkout@v4
        with:
          repository: 'duckduckgo/duckduckgo-privacy-extension'
          path: 'extension'
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'reference-tests/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'
      - run: cd reference-tests && npm link
      - name: Setup Extension
        working-directory: ./extension
        run: |
          npm run install-ci
          npm link @duckduckgo/privacy-reference-tests
      - name: Test Extension (MV2)
        working-directory: ./extension
        run: |
          npm test

  ddg2dnr:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'reference-tests'
      - uses: actions/checkout@v4
        with:
          repository: 'duckduckgo/duckduckgo-privacy-extension'
          path: 'extension'
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'reference-tests/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'
      - run: cd reference-tests && npm link
      - name: Setup Extension
        working-directory: ./extension
        run: |
          npm run install-ci
          npm link @duckduckgo/privacy-reference-tests
      - name: Test ddg2dnr (MV3)
        working-directory: ./extension/packages/ddg2dnr
        # npm 11+ no longer forwards args through the nested `npm run` calls in
        # ddg2dnr's `test` script, so call each platform's script directly.
        run: |
          npm run test:chrome -- --grep Reference
          npm run test:firefox -- --grep Reference

  BrowserServicesKit:
    name: BSK unit tests

    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          repository: 'duckduckgo/apple-browsers'
          path: 'apple-monorepo'
          submodules: recursive
      - name: Check out the tests
        uses: actions/checkout@v4
        with:
          path: 'apple-monorepo/SharedPackages/BrowserServicesKit/Tests/BrowserServicesKitTests/Res/privacy-reference-tests'

      - name: Set cache key hash
        working-directory: ./apple-monorepo/SharedPackages/BrowserServicesKit
        run: |
          has_only_tags=$(jq '[ .pins[].state | has("version") ] | all' Package.resolved)
          if [[ "$has_only_tags" == "true" ]]; then
            echo "cache_key_hash=${{ hashFiles('apple-monorepo/SharedPackages/BrowserServicesKit/Package.resolved') }}" >> $GITHUB_ENV
          else
            echo "Package.resolved contains dependencies specified by branch or commit, skipping cache."
          fi

      - name: Cache SPM
        if: env.cache_key_hash
        uses: actions/cache@v4
        with:
          path: ./apple-monorepo/SharedPackages/BrowserServicesKit/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ env.cache_key_hash }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select Xcode
        # apple-browsers may pin an Xcode that GitHub-hosted runners don't ship yet;
        # fall back to the newest installed Xcode in that case.
        run: |
          xcode_version=$(<apple-monorepo/.xcode-version)
          xcode_path="/Applications/Xcode_${xcode_version}.app"
          if [[ ! -d "$xcode_path" ]]; then
            xcode_path=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
            echo "::warning::Xcode ${xcode_version} is not installed, using ${xcode_path}"
          fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Resolve packages
        working-directory: ./apple-monorepo/SharedPackages/BrowserServicesKit
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme BrowserServicesKit-Package \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build BSK
        working-directory: ./apple-monorepo/SharedPackages/BrowserServicesKit
        run: |
          set -o pipefail && xcodebuild build-for-testing \
            -scheme BrowserServicesKit-Package \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-log.txt | xcbeautify

      - name: Run tests
        working-directory: ./apple-monorepo/SharedPackages/BrowserServicesKit
        # Only run the suites that load privacy-reference-tests; the rest of BSK
        # is covered by apple-browsers' own CI.
        run: |
          set -o pipefail && xcodebuild test-without-building \
            -scheme BrowserServicesKit-Package \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -only-testing:BrowserServicesKitTests/AmpMatchingTests \
            -only-testing:BrowserServicesKitTests/AppHTTPSUpgradeStoreTests \
            -only-testing:BrowserServicesKitTests/ContentBlockerReferenceTests \
            -only-testing:BrowserServicesKitTests/DomainMatchingReportTests \
            -only-testing:BrowserServicesKitTests/DomainMatchingTests \
            -only-testing:BrowserServicesKitTests/FingerprintingReferenceTests \
            -only-testing:BrowserServicesKitTests/GPCReferenceTests \
            -only-testing:BrowserServicesKitTests/HTTPSUpgradeReferenceTests \
            -only-testing:BrowserServicesKitTests/PrivacyConfigurationReferenceTests \
            -only-testing:BrowserServicesKitTests/ReferrerTrimmingTests \
            -only-testing:BrowserServicesKitTests/TrackerAllowlistReferenceTests \
            -only-testing:BrowserServicesKitTests/URLParameterTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a build-log.txt | xcbeautify --report junit --report-path . --junit-report-filename tests.xml

      - name: Publish Unit Tests Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          check_name: BSK Test Report
          report_paths: ./apple-monorepo/SharedPackages/BrowserServicesKit/tests.xml
          require_tests: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log.txt
          path: ./apple-monorepo/SharedPackages/BrowserServicesKit/build-log.txt
